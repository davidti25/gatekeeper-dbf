# ==============================================================================
# GateKeeper-DBF - Pre-commit Git Hooks (DevSecOps - Fase 4.2)
# ==============================================================================
repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.17.3
    hooks:
      - id: ruff-check
        args: [--fix]
      - id: ruff-format

  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.24.0
    hooks:
      - id: gitleaks

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: check-yaml
      # CSS gerado pelo Tailwind (minificado, sem quebra de linha final) não é editado à mão:
      # alterá-lo aqui faria o hook tailwind-css-atualizado acusar arquivo desatualizado.
      - id: end-of-file-fixer
        exclude: ^static/css/tailwind\.min\.css$
      - id: trailing-whitespace
        exclude: ^static/css/tailwind\.min\.css$
      - id: check-added-large-files

  - repo: local
    hooks:
      - id: tailwind-css-atualizado
        name: tailwind.min.css atualizado
        entry: scripts/build_css.sh --check
        language: system
        pass_filenames: false
        files: ^(templates/.*\.html|static/css/input\.css|static/js/.*\.js|apps/.*/forms\.py|tailwind\.config\.js)$
