[tool.ruff]
target-version = "py314"
line-length = 120
extend-exclude = [
    "migrations",
    "staticfiles",
    "venv",
    ".venv",
]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "C4",  # flake8-comprehensions
    "B",   # flake8-bugbear
    "UP",  # pyupgrade
]
ignore = [
    "RUF012", # Mutable default value for class attribute (Django models/admin)
    "E501",   # Line too long (handled by formatter)
]

[tool.ruff.lint.isort]
known-first-party = ["core", "apps"]

[tool.bandit]
exclude_dirs = ["venv", "staticfiles", "tests.py", "migrations"]
skips = ["B101"]
