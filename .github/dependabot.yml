# ==============================================================================
# Dependabot Configuration - GateKeeper-DBF
# Monitoramento e Atualização Automatizada de Dependências (DevSecOps)
# ==============================================================================

version: 2
updates:
  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10
    labels:
      - "dependencies"
      - "security"
    commit-message:
      prefix: "deps"
