name: GateKeeper-DBF CI/CD & DevSecOps Pipeline

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  devsecops-pipeline:
    name: DevSecOps Quality & Security Checks
    runs-on: ubuntu-latest

    env:
      DJANGO_SETTINGS_MODULE: core.settings
      SECRET_KEY: ci-test-insecure-key-do-not-use-in-production-1234567890
      DEBUG: 'False'
      ALLOWED_HOSTS: localhost,127.0.0.1,testserver
      TIME_ZONE: America/Bahia

    steps:
      - name: 📥 Checkout do Repositório
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0

      - name: 🐍 Configurar Python 3.14
        uses: actions/setup-python@42375524e23c412d93fb67b49958b491fce71c38 # v5.4.0
        with:
          python-version: '3.14'
          cache: 'pip'

      - name: 📦 Instalar Dependências Auditadas (com SHA-256 Hashes)
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt

      - name: 🧹 Linting & Formatação (Ruff)
        run: |
          ruff check .
          ruff format --check .

      - name: 🛡️ Análise Estática de Segurança (Bandit SAST)
        run: |
          bandit -c pyproject.toml -r apps core

      - name: 🔍 Auditoria de Vulnerabilidades em Dependências (pip-audit)
        run: |
          pip-audit -r requirements.txt

      - name: 🔑 Verificação de Vazamento de Segredos (Gitleaks)
        uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7 # v2.3.9
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: 🗄️ Verificação de Integridade das Migrações
        run: |
          python manage.py makemigrations --check --dry-run

      - name: 🎨 Verificação do CSS Compilado (Tailwind)
        # Recompila com o binário fixado (v3.4.17 + SHA-256) e falha se o
        # static/css/tailwind.min.css commitado não corresponder aos templates.
        run: |
          bash scripts/build_css.sh --check

      - name: 📦 Coleta de Estáticos com Manifesto (igual ao Dockerfile)
        # Com DEBUG=False (sempre nos testes), o {% static %} exige o manifesto do
        # CompressedManifestStaticFilesStorage. Sem este passo, toda página renderizada falha.
        run: |
          python manage.py collectstatic --noinput

      - name: 🧪 Execução de Testes com Cobertura (Coverage >= 85%)
        run: |
          coverage run manage.py test apps.governance
          coverage report

      - name: 🚀 Verificação de Hardening para Produção (check --deploy)
        run: |
          SECURE_HSTS_SECONDS=31536000 \
          SECURE_SSL_REDIRECT=True \
          SESSION_COOKIE_SECURE=True \
          CSRF_COOKIE_SECURE=True \
          python manage.py check --deploy

      - name: 🐳 Verificação de Fail-Closed no Docker Compose (Fase 8.1)
        run: |
          # Sem variáveis de ambiente no container runner, o docker compose deve recusar a inicialização
          if docker compose config -q >/dev/null 2>&1; then
            echo "[-] ERRO: docker compose permitiu inicialização sem SECRET_KEY e POSTGRES_PASSWORD!" >&2
            exit 1
          else
            echo "[+] Sucesso: docker compose falhou fechado conforme esperado (variáveis obrigatórias :?)."
          fi
